name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable runner-only test database; no application secrets.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost/postgres
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.lock.txt --no-deps --disable-pip
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock.txt
      - run: python -m commerce.manage init
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python -m scripts.smoke
      - if: failure()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
